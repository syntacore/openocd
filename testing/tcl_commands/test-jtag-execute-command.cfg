namespace import testing_helpers::*
namespace import jtag_dummy_testing::*

set ntaps 2

setup $ntaps
set tap [lindex [jtag names] 0]
set second_tap [lindex [jtag names] 1]

check_generic_error {jtag execute scan $tap -ir 0}

init

set escaped_tap [string map {. {\.}} $tap]

jtag execute scan $tap

check_invalid_arg \
	{jtag execute scan unknown_tap}
check_syntax_err \
	{jtag execute scan}

jtag execute scan $tap -ir 0

jtag execute scan $tap $second_tap -ir 0 0

check_invalid_arg \
	{jtag execute scan $tap $tap -ir 0 0}

check_invalid_arg \
	{jtag execute scan $tap $second_tap -ir 0}

check_invalid_arg \
	{jtag execute unknown_cmd $tap -ir 0}

check_invalid_arg \
	{jtag execute scan $tap -ir not_a_number}

check_invalid_arg \
	{jtag execute scan $tap -ir}

jtag execute scan $tap -ir 0 -dr 32:0
jtag execute scan $tap -ir 0 -dr 1:0,31:0
jtag execute scan $tap -dr 32:0
jtag execute scan $tap -ir 0 -dr 1:0,31:0

set humongous_memory_size_bits [expr {(640 + 1) * 1024 * 8}]
check_overflow_err \
	{jtag execute scan $tap -dr ${humongous_memory_size_bits}:0}

check_underflow_err \
	{jtag execute scan $tap -dr -1:0}

check_invalid_arg \
	{jtag execute scan $tap -dr not_a_number:0}

check_invalid_arg \
	{jtag execute scan $tap -dr {}}

check_invalid_arg \
	{jtag execute scan $tap -dr ,}

check_invalid_arg \
	{jtag execute scan $tap -dr 1:not_a_number}

check_invalid_arg \
	{jtag execute scan $tap -dr not_a_field}

jtag execute scan $tap -ir 0 -endstate RUN/IDLE
jtag execute scan $tap -ir 0 -endstate IRPAUSE

check_invalid_arg \
	{jtag execute scan $tap -ir 0 -endstate DRSHIFT}
check_invalid_arg \
	{jtag execute scan $tap -ir 0 -endstate NOT_A_STATE}
check_syntax_err \
	{jtag execute scan $tap -ir 0 -endstate}

check_matches \
	[subst -nocommands -nobackslashes \
		{IR $escaped_tap 0[01]\nDR $escaped_tap 0[01]} \
	] \
	{jtag execute scan $tap -ir 0 -dr 1:0}

check_invalid_arg \
	{jtag execute scan $tap $second_tap -ir 0 -endstate IRPAUSE}
check_invalid_arg \
	{jtag execute scan $tap $second_tap -ir 0 -dr 1:0 1:0}

jtag execute plain-scan -ir 8 00

jtag execute plain-scan -ir 0x10 0000

jtag execute plain-scan -dr 8 ff

jtag execute plain-scan -ir 9 0000

jtag execute plain-scan -ir 1 00

jtag execute plain-scan -ir 8 00 -endstate RUN/IDLE
jtag execute plain-scan -ir 8 00 -endstate IRPAUSE

jtag execute plain-scan -ir 8 00 plain-scan -dr 8 ff

jtag execute scan $tap -ir 0 plain-scan -ir 8 00

jtag execute plain-scan -ir 8 0000

check_invalid_arg \
	{jtag execute plain_scn -ir 8 00}

check_syntax_err \
	{jtag execute plain-scan 8 00}
check_syntax_err \
	{jtag execute plain-scan -irr 8 00}

check_syntax_err \
	{jtag execute plain-scan -ir}
check_syntax_err \
	{jtag execute plain-scan -ir 8}

check_invalid_arg \
	{jtag execute plain-scan -ir not_a_number 00}

check_underflow_err \
	{jtag execute plain-scan -ir 0 00}
check_underflow_err \
	{jtag execute plain-scan -ir -1 00}

check_overflow_err \
	{jtag execute plain-scan -ir [string repeat 9 22] 00}
check_overflow_err \
	{jtag execute plain-scan -ir ${humongous_memory_size_bits} 00}

check_invalid_arg \
	{jtag execute plain-scan -ir 8 xyz}
check_invalid_arg \
	{jtag execute plain-scan -ir 8 {}}
check_invalid_arg \
	{jtag execute plain-scan -ir 4 0}

check_invalid_arg \
	{jtag execute plain-scan -ir 8 00 -endstate NOT_A_STATE}
check_invalid_arg \
	{jtag execute plain-scan -ir 8 00 -endstate DRSHIFT}
check_syntax_err \
	{jtag execute plain-scan -ir 8 00 -endstate}

check_matches {^00$} \
	{jtag execute plain-scan -ir 8 00}
check_matches {^00$} \
	{jtag execute plain-scan -dr 8 ff}
check_matches {^0000$} \
	{jtag execute plain-scan -ir 9 0000}
check_matches {^00$} \
	{jtag execute plain-scan -ir 1 00}
check_matches {^0000$} \
	{jtag execute plain-scan -ir 0x10 0000}
check_matches {^00$} \
	{jtag execute plain-scan -ir 8 0000}

shutdown

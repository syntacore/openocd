source [find syntacore/examine-jtag-chain.tcl]
namespace import testing_helpers::*

# --- Mock infrastructure ---
set ::jtag_history {}
set ::scan_return_bits {}
set ::scan_cursor 0
set ::suffix_mode input_bits

proc ::jtag {args} {
	lappend ::jtag_history $args
	switch -glob [join $args] {
		{pathmove *} {
			return ""
		}
		{execute plain-scan -dr *} {
			set num_bits [lindex $args 3]
			set input_data [lindex $args 4]
			set input_bits [hex_to_bits $input_data]
			set n_device [llength $::scan_return_bits]
			set result_bits {}
			for {set j 0} {$j < $num_bits} {incr j} {
				set cursor_pos [expr {$::scan_cursor + $j}]
				if {$cursor_pos < $n_device} {
					lappend result_bits [lindex $::scan_return_bits $cursor_pos]
				} else {
					set echo_idx [expr {($cursor_pos - $n_device) % $num_bits}]
					switch $::suffix_mode {
						input_bits {
							lappend result_bits [lindex $input_bits $echo_idx]
						}
						ones { lappend result_bits 1 }
						zeroes { lappend result_bits 0 }
						default { error "Unknown suffix_mode: $::suffix_mode" }
					}
				}
			}
			incr ::scan_cursor $num_bits
			return [bits_to_hex $result_bits]
		}
		default {
			error "Unexpected jtag command: $args"
		}
	}
}

proc ::transport {args} {
	switch -glob [join $args] {
		{select jtag} {
			return
		}
		default {
			error "Unexpected transport command: $args"
		}
	}
}

proc ::init {} {
}

# --- Helpers ---

proc hex_to_bits {hex_str} {
	set bits {}
	set len [string length $hex_str]
	for {set i 0} {$i < $len} {incr i 2} {
		set byte_val 0x[string range $hex_str $i [expr {$i + 1}]]
		for {set j 0} {$j < 8} {incr j} {
			lappend bits [expr {($byte_val >> $j) & 1}]
		}
	}
	return $bits
}

proc bits_to_hex {bits} {
	set hex ""
	set len [llength $bits]
	for {set i 0} {$i < $len} {incr i 8} {
		set byte_val 0
		for {set j 0} {$j < 8} {incr j} {
			set byte_val [expr {$byte_val | ([lindex $bits [expr {$i + $j}]] << $j)}]
		}
		append hex [format %.2x $byte_val]
	}
	return $hex
}

proc build_scan_data {args} {
	set bits {}
	set prev_bits {}
	foreach entry $args {
		if {$entry eq "bypass"} {
			lappend bits 0
			set prev_bits {0}
		} elseif {$entry eq "repeat"} {
			if {[llength $prev_bits] == 0} {
				error "repeat without prior device"
			}
			foreach b $prev_bits {
				lappend bits $b
			}
		} else {
			set val [expr {$entry}]
			set cur {}
			for {set i 0} {$i < 32} {incr i} {
				set b [expr {($val >> $i) & 1}]
				lappend bits $b
				lappend cur $b
			}
			set prev_bits $cur
		}
	}
	set ::scan_return_bits $bits
}

proc verify_jtag_calls {} {
	set found_pathmove_reset 0
	foreach call $::jtag_history {
		if {[lindex $call 0] eq "pathmove"} {
			foreach arg $call {
				if {$arg eq "RESET"} {
					set found_pathmove_reset 1
				}
			}
		}
	}
	if {!$found_pathmove_reset} {
		test_failure \
			"Expected pathmove with RESET, got calls: $::jtag_history"
	}

	set plain_scan_count 0
	foreach call $::jtag_history {
		if {[lindex $call 0] eq "execute" \
				&& [lindex $call 1] eq "plain-scan" \
				&& [lindex $call 2] eq "-dr"} {
			incr plain_scan_count
		}
	}
	if {$plain_scan_count < 1} {
		test_failure \
			"Expected at least one plain-scan -dr call, got none"
	}
}

proc check_scan {scan_args expected} {
	variable ::syntacore::jtag::chain
	set ::jtag_history {}
	set ::scan_cursor 0
	eval build_scan_data $scan_args
	syntacore::jtag::scan_idcodes
	if {$chain ne $expected} {
		test_failure \
			"'$scan_args' produced '$chain', expected '$expected'"
	}
	verify_jtag_calls
}

# --- Test cases ---

check_scan {0xdeadbeef} [list [list idcode [format %u 0xdeadbeef]]]

check_scan {bypass} [list {}]

check_scan {bypass 0xdeadbeef} \
	[list {} [list idcode [format %u 0xdeadbeef]]]

check_scan {0xdeadbeef bypass} \
	[list [list idcode [format %u 0xdeadbeef]] {}]

# --- Suffix-mode tests — all error out ---

proc check_scan_error {scan_args} {
	set ::jtag_history {}
	set ::scan_cursor 0
	eval build_scan_data $scan_args
	check_error_code {SYNTACORE JTAG CONNECTION} {syntacore::jtag::scan_idcodes}
	verify_jtag_calls
}

# All-ones suffix, no TAPs — caught by 0xffffffff per-word check
set ::suffix_mode ones
check_scan_error {}

# All-zeroes suffix, no TAPs — caught by trailing_zero_limit
set ::suffix_mode zeroes
set ::syntacore::jtag::trailing_zero_limit 8
check_scan_error {}

set ::suffix_mode ones

# TAP + all-ones suffix — caught by 0xffffffff per-word check
check_scan_error {0xdeadbeef}

# TAP + all-zeroes suffix — caught by trailing_zero_limit
set ::suffix_mode zeroes
set ::syntacore::jtag::trailing_zero_limit 8
check_scan_error {0xdeadbeef}

set ::suffix_mode ones

# bypass → idcode → bypass + all-ones — caught by 0xffffffff per-word check
check_scan_error {bypass 0xdeadbeef bypass}

# bypass → idcode → bypass + all-zeroes — caught by trailing_zero_limit
set ::suffix_mode zeroes
set ::syntacore::jtag::trailing_zero_limit 8
check_scan_error {bypass 0xdeadbeef bypass}

# trailing_zero_limit == 0 disables the guard: a chain of bypass TAPs is
# scanned to the 0xff terminator without raising
set ::suffix_mode input_bits
set ::syntacore::jtag::trailing_zero_limit 0
check_scan [lrepeat 4 bypass] [lrepeat 4 {}]

# A big number of bypass TAPs on an open (zero-feedback) chain — guard trips
set ::scan_return_bits {}
for {set i 0} {$i < 100} {incr i} {
	lappend ::scan_return_bits 0
}
set ::suffix_mode zeroes
set ::syntacore::jtag::trailing_zero_limit 8
set ::jtag_history {}
set ::scan_cursor 0
check_error_code {SYNTACORE JTAG CONNECTION} {syntacore::jtag::scan_idcodes}
verify_jtag_calls

set ::syntacore::jtag::trailing_zero_limit 65

# --- Multi-chunk test (more TAPs than one scan_chunk) ---

set ::suffix_mode input_bits
set ::syntacore::jtag::trailing_zero_limit 65

set n_taps 256
set ::scan_return_bits {}
for {set i 0} {$i < $n_taps} {incr i} {
	set val 0xdeadbeef
	for {set j 0} {$j < 32} {incr j} {
		lappend ::scan_return_bits [expr {($val >> $j) & 1}]
	}
}

set ::syntacore::jtag::scan_chunk 256
set ::jtag_history {}
set ::scan_cursor 0
syntacore::jtag::scan_idcodes
set chain_len [llength $::syntacore::jtag::chain]
if {$chain_len != $n_taps} {
	test_failure "Expected $n_taps TAPs, got $chain_len"
}
verify_jtag_calls

set ::syntacore::jtag::scan_chunk 32
check_scan {bypass 0xdeadbeef} \
	[list {} [list idcode [format %u 0xdeadbeef]]]

# --- Structured error codes: CONFIG class ---

set ::suffix_mode input_bits
set ::syntacore::jtag::scan_chunk 66
check_error_code {SYNTACORE JTAG CONFIG} {syntacore::jtag::scan_idcodes}
set ::syntacore::jtag::scan_chunk 256

# --- Consumer-style smoke test: try ... trap on the CONNECTION class ---

set ::suffix_mode ones
set ::scan_return_bits {}
set ::jtag_history {}
set ::scan_cursor 0
set trapped_msg ""
try {
	syntacore::jtag::scan_idcodes
	test_failure "scan_idcodes succeeded; expected a connection error to be trapped"
} trap {SYNTACORE JTAG CONNECTION} {msg opts} {
	set trapped_msg $msg
}
if {[string first "all-ones IDCODE detected" $trapped_msg] == -1} {
	test_failure "trap handler got unexpected message: '$trapped_msg'"
}
verify_jtag_calls

shutdown
